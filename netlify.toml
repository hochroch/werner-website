[build]
  publish = "."

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=86400"

# Redirect www to non-www
[[redirects]]
  from = "https://www.wernercoach.com/*"
  to = "https://wernercoach.com/:splat"
  status = 301
  force = true

# Block dev/demo files from public access
[[redirects]]
  from = "/demo-*"
  to = "/404"
  status = 404

[[redirects]]
  from = "/prototype/*"
  to = "/404"
  status = 404

[[redirects]]
  from = "/taglines.md"
  to = "/404"
  status = 404

[[redirects]]
  from = "/HANDOFF.md"
  to = "/404"
  status = 404

# Legacy quote link → live quote page (was a hard 404; still linked from SMS/legal pages)
[[redirects]]
  from = "/request-quote"
  to = "/quote-widget"
  status = 301
  force = true

# Canonicalize .html → extensionless so each page has a single indexable URL.
# force=true is required because the .html file physically exists.
# A request for the clean URL (/about) is served from about.html with no redirect, so there is no loop.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/about.html"
  to = "/about"
  status = 301
  force = true

